<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gallery | Kaiser Permanente</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Immediate Authentication Guard -->
  <script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
      window.location.replace('index.html');
    }
  </script>
</head>
<body class="video-page-body">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar py-3">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand d-flex align-items-center fw-semibold text-white" href="#">
        <img src="img/chooch-logo-white.svg" alt="Chooch Logo" height="34" class="me-3 d-inline-block align-text-top" style="object-fit: contain;">
        <span>AI Gallery Walk &bull; Redesign Operations</span>
      </a>

      <!-- Right Side Controls -->
      <div class="d-flex align-items-center gap-3 ms-auto">
        <div class="d-none d-sm-flex align-items-center text-secondary small bg-dark py-1 px-3 rounded-pill border border-secondary border-opacity-25">
          <i class="bi bi-person-check text-info me-2 fs-6"></i>
          <span id="userBadge" class="text-light fw-medium">admin@chooch.com</span>
        </div>
        <button class="btn btn-outline-danger btn-sm px-3 d-flex align-items-center" id="logoutBtn" title="Log out of session">
          <i class="bi bi-box-arrow-right me-1"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Video Main Content Section -->
  <main class="video-container-wrapper container-fluid px-3 px-md-4 py-3">
    <div class="row justify-content-center">
      <div class="col-12">
        <!-- Responsive Full Width Video Element -->
        <div class="video-card-wrapper position-relative">
          <video 
            id="mainVideoPlayer" 
            class="responsive-full-video" 
            controls 
            controlsList="nodownload" 
            playsinline 
            preload="metadata"
          >
            <source src="video/Kaiser_Permanente_AI_Gallery_Walk-Redesign_Operations_1.mp4" type="video/mp4">
            Your browser does not support HTML5 video playback.
          </video>
        </div>

        <!-- Video Description / Meta Card -->
        <div class="video-info-card mt-3">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div>
              <h5 class="text-white mb-1 fw-bold">
                <i class="bi bi-film text-primary me-2"></i>Kaiser Permanente AI Gallery Walk - Redesign Operations 1
              </h5>
              <p class="text-secondary small mb-0">High-Definition Internal Presentation Video</p>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-secondary bg-opacity-25 text-info border border-info border-opacity-25 px-2.5 py-1.5">
                <i class="bi bi-shield-lock-fill me-1"></i> Protected Content
              </span>
              <span class="badge bg-secondary bg-opacity-25 text-light border border-light border-opacity-25 px-2.5 py-1.5">
                MP4 Video
              </span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Video Page Script -->
  <script>
    // Display signed in user email
    const storedEmail = sessionStorage.getItem('userEmail');
    if (storedEmail) {
      const userBadge = document.getElementById('userBadge');
      if (userBadge) userBadge.textContent = storedEmail;
    }

    // Logout handling
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', () => {
      // Pause video if playing
      const video = document.getElementById('mainVideoPlayer');
      if (video) video.pause();

      // Clear session data
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('userEmail');

      // Redirect to login page
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
